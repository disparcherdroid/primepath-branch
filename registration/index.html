<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | PrimePath Branch</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand-name">PrimePath Digital</div>
        <nav>
            <a href="../" class="nav-link">Home</a>
        </nav>
    </header>
    <main class="reg-wrapper">
        <h1 class="reg-header--h1">Registration</h1>
        <div class="reg-wrapper-2">
            <div class="reg-header">
                <p class="reg-subtext">this registration serves as your attendance and will be recorded into the system database for future reference and for certifications. So please answer accurately.</p>
            </div>

            <form id="registration-form" class="glass-card">
                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" name="fullName" placeholder="Juan Dela Cruz" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="juan@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" placeholder="09XXXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label for="service">Service</label>
                    <select id="service" name="service" required>
                        <option value="">Choose a service</option>
                        <option value="branding development">Branding Development</option>
                        <option value="ui/ux design">UI/UX Design</option>
                        <option value="web applications">Web Applications</option>
                        <option value="full stack sites">Full Stack Sites</option>
                        <option value="site management">Site Management</option>
                        <option value="e-commerce integration">E-Commerce Integration</option>
                        <option value="website development">Website Development</option>
                        <option value="non-code sites">Non-Code Sites</option>
                        <option value="website refurbishment">Website Refurbishment</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="preferred-date">Preferred date</label>
                    <input type="date" id="preferred-date" name="preferredDate" required>
                </div>

                <div class="form-group">
                    <label for="notes">Notes (optional)</label>
                    <textarea id="notes" name="notes" rows="4" placeholder="Project details or goals..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Register</button>
                <p id="form-message"></p>
            </form>
        </div>
    </main>
    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
