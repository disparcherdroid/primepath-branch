<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | PrimePath Branch</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="navbar flex items-center justify-between px-4 py-4 md:px-[8%] md:py-5">
        <div class="brand-name">PrimePath Development</div>
        <nav>
            <a href="../" class="nav-link text-3xl">Home</a>
        </nav>
    </header>
    <main class="reg-wrapper">
        <h1 class="reg-header--h1">Registration</h1>
        <div class="reg-wrapper-2">
            <div class="reg-header">
                <p class="reg-subtext">this registration serves as your attendance and will be recorded into the system database for future reference and for certifications. So please answer accurately.</p>
            </div>

            <form id="registration-form" class="glass-card">
                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" name="fullName" placeholder="Juan Dela Cruz" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="juan@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" name="phone" placeholder="09XXXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Imus, Cavite" required>
                </div>

                <div class="form-group">
                    <label for="tup-id">TUP ID</label>
                    <input type="text" id="tup-id" name="tupId" placeholder="TUPM-26-XXXX" required>
                </div>

                <div class="form-group">
                    <label for="degree-and-program">Degree and Program</label>
                    <input type="text" id="degree-and-program" name="degreeAndProgram" placeholder="BS Electronics Engineering" required>
                </div>

                <div class="form-group">
                    <label for="year-and-section">Year and Section</label>
                    <input type="text" id="year-and-section" name="yearAndSection" placeholder="1C" required>
                </div>

                <button type="submit" class="submit-btn">Register</button>
                <p id="form-message"></p>
            </form>
        </div>
    </main>
    <script src="../script.js"></script>
</body>
</html>
